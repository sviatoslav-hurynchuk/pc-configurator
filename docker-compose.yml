services:
  # Наш PHP API
  backend:
    build: ./backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      - db

  # Наш React додаток
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Цей рядок не дає Докеру затерти папку node_modules зсередини контейнера
      - /app/node_modules
    environment:
      # Важливо для Windows, щоб React миттєво оновлював сторінку при зміні коду
      - CHOKIDAR_USEPOLLING=true 

  # База даних MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pc_builder
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  uploads_data:
  db_data: