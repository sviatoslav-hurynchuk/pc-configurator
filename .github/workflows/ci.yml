name: CI Pipeline

# Run tests on every push to the main branch and on pull requests
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend-tests:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    # Створюємо сервіс бази даних для тестів
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pc_builder
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql # Гарантуємо наявність драйвера БД

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup DB host
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Import Database structure
        run: mysql -h 127.0.0.1 -u root -proot pc_builder < database/init.sql

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php tests/

  frontend-tests:
    name: Run React Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test